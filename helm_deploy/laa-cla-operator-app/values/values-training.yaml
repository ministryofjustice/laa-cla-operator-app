# Training Environment Values
# Overrides for the Training environment

replicaCount: 1

image:
  pullPolicy: Always
  containerPort: 3000

ingress:
  enabled: true
  className: "modsec"
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: laa-cla-operator-app-laa-cla-operator-app-training-green
    external-dns.alpha.kubernetes.io/aws-weight: "100"
  hosts:
    - host: laa-cla-operator-app-training.cloud-platform.service.justice.gov.uk
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: laa-cla-operator-app-training-tls
      hosts:
        - laa-cla-operator-app-training.cloud-platform.service.justice.gov.uk
  whitelist:
    enabled: false

resources: {}

autoscaling:
  enabled: false

envVars:
  BACKEND_BASE_URL:
    value: "http://cla-backend-app.laa-cla-backend-training.svc.cluster.local"
  NODE_ENV:
    value: "production"
  ENTRA_REDIRECT_URI:
    value: "https://laa-cla-operator-app-training.cloud-platform.service.justice.gov.uk/redirect"