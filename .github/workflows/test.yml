name: Test

on: workflow_call

permissions: {}

env:
  SESSION_SECRET: "TEST_SESSION_SECRET"
  SESSION_NAME: "TEST_SESSION_NAME"
  # TODO: static content vars, see TODO in config.ts to stop reading these from env
  CONTACT_EMAIL: "test@example.com"
  CONTACT_PHONE: "0300 200 2020"
  DEPARTMENT_NAME: "Legal Aid Agency"
  DEPARTMENT_URL: "https://www.gov.uk/government/organisations/legal-aid-agency"
  SERVICE_NAME: "Assess and refer for civil legal advice"
  SERVICE_PHASE: "Beta"
  SERVICE_URL: "https://example.com"
  ENTRA_AUTHORITY: "https://login.microsoftonline.com/test-tenant-id"
  ENTRA_TENANT_ID: "test-tenant-id"
  ENTRA_CLIENT_ID: "test-client-id"
  ENTRA_CLIENT_SECRET: "test-client-secret"
  ENTRA_REDIRECT_URI: "http://localhost:3000/redirect"
  ENTRA_POST_REDIRECT_URI: "/"
  ENTRA_SCOPES: "openid,profile,email"
  ENTRA_EXPECTED_AUDIENCE: "test-expected-audience"

jobs:
  unit_test:
    name: Unit Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"

      - name: Enable Corepack
        run: |
          corepack enable

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Unit test with coverage check
        run: |
          yarn coverage

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

  e2e_test:
    name: End-to-End Test (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"

      - name: Enable Corepack
        run: |
          corepack enable

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Install Playwright browsers
        run: |
          yarn playwright install --with-deps chromium

      - name: Build application
        run: |
          yarn build

      - name: Run e2e tests
        run: |
          yarn test:e2e

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/

